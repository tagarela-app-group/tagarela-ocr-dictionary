services:
  api:
    build: .
    command: sh -c "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      CAPTURE_UPLOAD_DIR: /var/lib/tagarela/captures
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - capture_uploads:/var/lib/tagarela/captures
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      CAPTURE_UPLOAD_DIR: /var/lib/tagarela/captures
      TRANSCRIPTION_MODEL_DIR: /var/lib/tagarela/whisper
    volumes:
      - .:/app
      - capture_uploads:/var/lib/tagarela/captures
      - whisper_models:/var/lib/tagarela/whisper
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tagarela}
      POSTGRES_USER: ${POSTGRES_USER:-tagarela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tagarela}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  capture_uploads:
  whisper_models:
