name: Esteira

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: Formato, análise, migrations e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: dsv
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tagarela
          POSTGRES_USER: tagarela
          POSTGRES_PASSWORD: tagarela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tagarela -d tagarela"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Ferramentas (ruff, coverage)
        run: pip install -r requirements-dev.txt

      - name: Formato
        run: ruff format --check .

      - name: Análise
        run: ruff check .

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Checagem do Django
        run: python manage.py check

      - name: Migration faltando
        run: python manage.py makemigrations --check --dry-run

      - name: Exemplos do contrato com o app
        uses: actions/checkout@v7
        with:
          repository: tagarela-app-group/tagarela
          ref: develop
          path: .app
          sparse-checkout: test/contract

      - name: Testes
        run: coverage run manage.py test
        env:
          APP_CONTRACT_DIR: .app/test/contract

      - name: Cobertura no resumo
        run: |
          echo "### Cobertura" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml

      - uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 7

  repeticao:
    name: Código repetido
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: jscpd
        run: npx --yes jscpd@5.4.1 apps config --format python --ignore "**/migrations/**" --threshold 0 --reporters console-full

  vulnerabilidades:
    name: Dependências vulneráveis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependências
        run: |
          pip install -r requirements.txt
          pip freeze > "$RUNNER_TEMP/instalado.txt"
          pip install -r requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r "$RUNNER_TEMP/instalado.txt" --no-deps --disable-pip --progress-spinner off

  docker:
    name: Docker (build + /health)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: .env de exemplo
        run: cp .env.dsv.example .env.dsv

      - name: Build e subida
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: /health 200
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/health

      - name: Segredo fora da imagem
        run: docker run --rm "$(docker compose images --quiet api)" sh -c 'test ! -e .env.dsv && test ! -e .git'

      - name: Logs
        if: failure()
        run: docker compose logs

  prd:
    name: Imagem de prd
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tagarela
          POSTGRES_USER: tagarela
          POSTGRES_PASSWORD: senha-de-teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tagarela -d tagarela"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cp .env.prd.example .env.prd
          docker build --tag tagarela-api .

      - name: Segredo fora da imagem
        run: docker run --rm tagarela-api sh -c 'test ! -e .env.prd && test ! -e .git'

      - name: Sem root
        run: test "$(docker run --rm tagarela-api id -u)" != "0"

      - name: Recusa os valores de exemplo
        run: docker run --rm --env-file .env.prd.example tagarela-api python manage.py check 2>&1 | grep "Configuração de prd inválida"

      - name: Configuração de teste
        run: |
          cat > "$RUNNER_TEMP/prd.env" <<EOF
          DJANGO_ENV=prd
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          DJANGO_ALLOWED_HOSTS=api.tagarela.test
          POSTGRES_PASSWORD=senha-de-teste
          POSTGRES_HOST=127.0.0.1
          GEMINI_API_KEY=chave-de-teste
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST=smtp.tagarela.test
          DEFAULT_FROM_EMAIL=Tagarela <nao-responda@tagarela.test>
          EOF

      - name: check --deploy
        run: docker run --rm --env-file "$RUNNER_TEMP/prd.env" tagarela-api python manage.py check --deploy --fail-level WARNING

      - name: Migrate
        run: docker run --rm --network host --env-file "$RUNNER_TEMP/prd.env" tagarela-api python manage.py migrate

      - name: Subida
        run: docker run --detach --name api --network host --env-file "$RUNNER_TEMP/prd.env" tagarela-api

      - name: /health 200
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors -H "Host: api.tagarela.test" http://localhost:8000/health

      - name: HTTP vira HTTPS
        run: |
          curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' -H "Host: api.tagarela.test" http://localhost:8000/admin/login/ | grep '^301 https://api.tagarela.test/admin/login/'

      - name: Estáticos do admin
        run: |
          curl --fail --silent --show-error --output /dev/null -H "Host: api.tagarela.test" -H "X-Forwarded-Proto: https" http://localhost:8000/static/admin/css/base.css

      - name: Logs
        if: failure()
        run: docker logs api
